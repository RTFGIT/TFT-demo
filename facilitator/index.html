<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../auth-gate.js"></script>
<script src="../embed-frame.js"></script>
<title>Try for Tomorrow — Facilitator Portal</title>
<link rel="stylesheet" href="../demo-theme.css">
<link rel="stylesheet" href="../worksheets/html/worksheet.css">
<!-- Stand-ins for the design sheet's Norwester + Indivisible — see theme-tokens.css. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300;1,600&display=swap">
<style>
  /* ─────────────────────────────────────────────────────────────────────────
     WORDPRESS COMPATIBILITY
     Each screen is a separate hash route mapping 1:1 to a WordPress permalink
     (see WP_ROUTES in wp-emulator.js). Every view renders from server-supplyable
     data, so each could become its own WP page template with the same markup.
     Colours/type: theme-tokens.css via demo-theme.css.
     ───────────────────────────────────────────────────────────────────────── */
  body { padding-top:3.4rem; }
  .wp-bar { position:fixed; top:0; left:0; right:0; height:38px; background:var(--chrome-bg);
            color:var(--chrome-ink); font-size:.78rem; display:flex; align-items:center;
            gap:.9rem; padding:0 1rem; z-index:50; }
  /* Ripped-paper edge under the bar (from the design sheet). */
  .wp-bar::after { content:''; position:absolute; left:0; right:0; top:100%; height:12px;
                   background:var(--torn-chrome); background-size:100% 100%; pointer-events:none; }
  .wp-bar .brand { font-weight:var(--display-weight); color:#fff; font-family:var(--font-display);
                   text-transform:var(--display-case); letter-spacing:.02em; font-size:.92rem;
                   display:flex; align-items:center; gap:.4rem; }
  .wp-bar .brand img { width:18px; height:auto; }
  .mode-pill { font-size:.64rem; font-weight:800; padding:.08rem .45rem; border-radius:99px; background:#d1fae5; color:#065f46; }
  .mode-pill.live { background:#dbeafe; color:#1e40af; }
  .wp-bar .spacer { flex:1; }
  .wp-bar a { color:#fff; opacity:.85; text-decoration:none; font-weight:600; }
  .wp-bar a:hover { opacity:1; text-decoration:underline; }
  .wp-bar .route { font-family:ui-monospace,Consolas,monospace; opacity:.6; font-size:.7rem; }
  /* Phones: drop the permalink + user so the "Demo home" / sign-out links stay reachable. */
  .wp-bar > * { white-space:nowrap; }
  @media (max-width:1100px){ .wp-bar .route { display:none; } }
  @media (max-width:820px){ .wp-bar { gap:.6rem; } #wp-user { display:none; } }
  @media (max-width:430px){ .wp-bar .brand span { display:none; }
                            .wp-bar { gap:.45rem; padding:0 .6rem; font-size:.72rem; }
                            .wp-bar .dash-btn { padding:.2rem .5rem; } }

  .rail { display:flex; align-items:center; gap:.4rem; margin-bottom:1.25rem; flex-wrap:wrap; }
  .rail .s { display:flex; align-items:center; gap:.35rem; font-size:.74rem; color:var(--muted); font-weight:700; }
  .rail .s .dot { width:22px; height:22px; border-radius:50%; background:var(--surface); border:1.5px solid var(--line);
                  display:grid; place-items:center; font-size:.68rem; }
  .rail .s.on  .dot { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .rail .s.on  { color:var(--ink); }
  .rail .s.done .dot { background:#d1fae5; border-color:#6ee7b7; color:#065f46; }
  .rail .bar { flex:1; min-width:12px; height:2px; background:var(--line); border-radius:2px; }

  /* ── Login ─────────────────────────────────────────────────────────────── */
  .hero { text-align:center; margin:1rem 0 1.4rem; }
  .hero img { width:64px; height:auto; animation:bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform:rotate(-10deg); } 50% { transform:rotate(8deg) translateY(-4px); } }
  .hero h1 { font-size:2.3rem; line-height:1; margin-top:.5rem; }
  .hero p { color:var(--muted); margin-top:.4rem; }
  .acct { display:flex; align-items:center; gap:.7rem; width:100%; text-align:left; cursor:pointer;
          border:1.5px solid var(--line); background:var(--surface); border-radius:var(--radius-sm);
          padding:.65rem .8rem; font:inherit; color:inherit; transition:border-color .12s, transform .12s; }
  .acct:hover { border-color:var(--accent-strong); transform:translateY(-1px); }
  .acct .av { width:34px; height:34px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
              display:grid; place-items:center; font-weight:var(--display-weight); font-family:var(--font-display); }
  .acct .grow { flex:1; min-width:0; }
  .acct small { color:var(--muted); font-family:ui-monospace,Consolas,monospace; font-size:.72rem; }

  /* ── Cohort cards ──────────────────────────────────────────────────────── */
  .cohort-card { display:flex; align-items:center; gap:1rem; padding:1rem 1.1rem;
                 border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);
                 box-shadow:var(--shadow); flex-wrap:wrap; }
  .cohort-card .icon { width:46px; height:46px; border-radius:var(--radius-sm); background:var(--accent-soft); color:var(--accent-strong);
                       display:grid; place-items:center; flex:0 0 auto; font-family:var(--font-display);
                       font-weight:900; font-size:1.05rem; }
  .cohort-card .grow { flex:1; min-width:180px; }
  .cohort-card .ttl { font-weight:800; font-size:1.06rem; }
  .cohort-card .sub { font-size:.8rem; color:var(--muted); margin-top:.1rem; }
  .cohort-card .segs { margin-top:.5rem; max-width:260px; }
  .cohort-card .acts { display:flex; gap:.4rem; flex-wrap:wrap; justify-content:flex-end; }

  /* ── Sessions ──────────────────────────────────────────────────────────── */
  .session-row { display:flex; align-items:center; gap:.9rem; padding:.9rem 1rem;
                 border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);
                 text-decoration:none; color:inherit; transition:transform .1s, box-shadow .1s, border-color .1s; }
  .session-row:hover { transform:translateY(-1px); box-shadow:var(--shadow); border-color:var(--accent-strong); }
  .session-row.next { border:2px solid var(--accent); box-shadow:0 10px 26px -14px var(--accent); }
  .session-row .num { width:42px; height:42px; border-radius:var(--radius-sm); background:var(--surface-2);
                      border:1.5px solid var(--line); display:grid; place-items:center;
                      font-weight:var(--display-weight); font-family:var(--font-display); font-size:1.15rem; flex:0 0 auto; }
  .session-row.done .num { background:#d1fae5; border-color:#6ee7b7; color:#065f46; }
  .session-row.next .num { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .session-row .grow { flex:1; min-width:0; }
  .session-row .ttl { font-weight:800; }
  .session-row .sub { font-size:.78rem; color:var(--muted); }
  .grp-dots { display:flex; gap:3px; }
  .grp-dots i { width:8px; height:8px; border-radius:50%; background:var(--line); display:block; }
  .grp-dots i.done { background:var(--ok); }

  /* ── Groups & students ─────────────────────────────────────────────────── */
  /* Enrolment: full names in a numbered list (easy to check against a register),
     click a name to fix it, paste a whole class list at once. Pseudonymous IDs
     are hidden unless 'Show IDs' is on. Each group keeps its dashboard colour. */
  .group-card { border:1px solid color-mix(in srgb, var(--g, var(--accent)) 35%, var(--line));
                border-left:6px solid var(--g, var(--accent)); border-radius:var(--radius); background:var(--surface); overflow:hidden; }
  .group-head { display:flex; align-items:center; gap:.6rem; padding:.6rem .85rem;
                background:color-mix(in srgb, var(--g, var(--accent)) 9%, var(--surface)); border-bottom:1px solid var(--line); }
  .group-head .gdot { width:12px; height:12px; border-radius:50%; background:var(--g, var(--accent)); flex:0 0 auto; }
  .group-head input { border:1px solid transparent; background:transparent; font-weight:800; font-size:1rem;
                      padding:.2rem .35rem; border-radius:6px; flex:1; min-width:0; }
  .group-head input:hover { border-color:var(--line); background:var(--surface); }
  .group-body { padding:.75rem .9rem .9rem; }
  .stu-list { list-style:none; display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));
              gap:.15rem 1rem; margin-bottom:.8rem; counter-reset:stu; }
  .stu { display:grid; grid-template-columns:26px minmax(0,1fr) auto; align-items:center; gap:.35rem;
         padding:.1rem .2rem; border-radius:6px; counter-increment:stu; }
  .stu:hover { background:var(--surface-2); }
  .stu::before { content:counter(stu); font-size:.74rem; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }
  .stu .nm { font:inherit; font-size:.95rem; font-weight:600; color:var(--ink); border:1px solid transparent; background:transparent;
             padding:.3rem .45rem; border-radius:6px; width:100%; min-width:0; }
  .stu .nm:hover { border-color:var(--line); background:var(--surface); }
  .stu .nm:focus { border-color:var(--accent-strong); background:var(--surface); outline:none; box-shadow:0 0 0 3px var(--accent-soft); }
  .stu .sub { grid-column:2 / 3; display:flex; gap:.4rem; flex-wrap:wrap; margin:-.2rem 0 .15rem .45rem; }
  .stu .sub:empty { display:none; }
  .stu .ref { display:none; font-size:.66rem; }
  .show-ids .stu .ref { display:inline-block; }
  .stu .dupnote { font-size:.72rem; color:var(--warn); font-weight:700; }
  .stu.dup .nm { border-color:color-mix(in srgb, var(--warn) 50%, var(--line)); background:var(--warn-bg); }
  .stu .x { border:none; background:transparent; color:var(--muted); cursor:pointer;
            font-size:1rem; line-height:1; padding:.3rem .45rem; border-radius:5px; }
  .stu .x:hover { background:#fee2e2; color:var(--danger); }
  .add-box { display:flex; gap:.5rem; align-items:flex-start; }
  .add-box textarea { flex:1; min-height:46px; height:46px; resize:vertical; font-size:.95rem; line-height:1.4; padding:.65rem .8rem; }
  .add-box .btn { min-width:92px; }
  .add-hint { font-size:.74rem; color:var(--muted); margin-top:.35rem; }
  .add-hint .flash { color:var(--ok); font-weight:800; }
  .ids-toggle { display:inline-flex; align-items:center; gap:.35rem; font-size:.8rem; color:var(--muted); cursor:pointer; }
  .ids-toggle input { width:auto; accent-color:var(--accent); }

  .video-frame { aspect-ratio:16/9; background:#0b1020; border-radius:var(--radius);
                 display:grid; place-items:center; color:#8a93b2; border:1px solid var(--line); }

  /* ── Delivery (pledge capture) ─────────────────────────────────────────── */
  .deliver { display:grid; grid-template-columns:minmax(230px,300px) minmax(0,1fr); gap:1.1rem; align-items:start; }
  .deliver > * { min-width:0; }
  @media (max-width:700px){ .deliver { grid-template-columns:1fr; } .deliver > :first-child { order:2; } }
  @media (min-width:701px) and (max-width:900px){ .deliver { grid-template-columns:minmax(200px,230px) minmax(0,1fr); gap:.8rem; } }
  .roster-panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
                  padding:.9rem; box-shadow:var(--shadow); position:sticky; top:3.6rem; }
  .roster-list { display:flex; flex-direction:column; gap:.3rem; max-height:52vh; overflow:auto; margin:.7rem -.2rem 0; padding:0 .2rem; }
  .roster-item { display:flex; align-items:center; gap:.55rem; padding:.42rem .55rem;
                 border-radius:var(--radius-sm); border:1.5px solid transparent; background:transparent;
                 font:inherit; color:inherit; text-align:left; width:100%; cursor:pointer; }
  .roster-item:hover:not(:disabled) { background:var(--surface-2); }
  .roster-item:disabled { cursor:default; }
  .roster-item.done { opacity:.55; }
  .roster-item.skipped .nm { text-decoration:line-through; }
  .roster-item.active { border-color:var(--accent); background:var(--accent-soft); }
  .roster-item .nm { flex:1; font-size:.88rem; font-weight:600; }
  .roster-item .st { font-size:.68rem; font-weight:800; color:var(--muted); }
  .roster-item.active .st { color:var(--accent-strong); }
  .roster-item.done .av { background:#d1fae5; color:#065f46; }
  .all-done { margin-top:.8rem; background:#d1fae5; border:1px solid #6ee7b7; color:#065f46;
              border-radius:var(--radius-sm); padding:.6rem .75rem; font-size:.84rem; font-weight:700;
              animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 5px rgba(16,185,129,.18); } }
  iframe.widget-frame { width:100%; border:none; display:block; min-height:560px; border-radius:var(--radius); background:transparent; }
  /* The embedded-widget boundary: makes the WordPress ↔ GitHub-Pages seam visible. */
  .embed { border:2px dashed color-mix(in srgb, var(--accent-strong) 55%, transparent); border-radius:calc(var(--radius) + 6px);
           padding:.55rem; position:relative; }
  .embed-tab { position:absolute; top:-11px; left:14px; background:var(--accent-strong); color:#fff;
               font-size:.64rem; font-weight:800; padding:.12rem .55rem; border-radius:6px; letter-spacing:.03em; }

  /* ── Complete ──────────────────────────────────────────────────────────── */
  .done-hero { text-align:center; padding:1.6rem 1.2rem 1.2rem; }
  .done-hero img { width:58px; height:auto; animation:bob 3s ease-in-out infinite; }
  .done-hero h1 { font-size:2rem; margin:.4rem 0 .2rem; }
  .breakdown { display:flex; flex-direction:column; gap:.55rem; }
  .bk { display:grid; grid-template-columns:1fr auto; gap:.2rem .7rem; align-items:center; }
  .bk .t { font-size:.86rem; }
  .bk .c { font-weight:var(--display-weight); font-family:var(--font-display); font-size:1.05rem; white-space:nowrap; }
  .bk .c .p { font-family:var(--font-body); font-size:.8rem; font-weight:700; color:var(--muted); margin-left:.3rem; }
  .bk .bar-track { grid-column:1 / -1; }
  .bk.top .t { font-weight:800; }
  .own-list { margin-top:.4rem; display:flex; flex-direction:column; gap:.35rem; }
  .own-list div { font-size:.84rem; background:var(--surface-2); border:1px solid var(--line);
                  border-radius:var(--radius-sm); padding:.45rem .6rem; }
  .next-card { display:flex; align-items:center; gap:.9rem; }
  .next-card .num { width:48px; height:48px; border-radius:var(--radius-sm); background:var(--accent); color:var(--accent-ink);
                    display:grid; place-items:center; font-weight:var(--display-weight); font-family:var(--font-display); font-size:1.3rem; flex:0 0 auto; }
  /* ── Top-bar dashboard button ──────────────────────────────────────────── */
  .wp-bar .dash-btn { display:inline-flex; align-items:center; gap:.35rem; opacity:1;
                      background:rgba(255,255,255,.14); padding:.22rem .7rem; border-radius:99px; }
  .wp-bar .dash-btn:hover { background:rgba(255,255,255,.24); text-decoration:none; }
  .wp-bar .dash-btn.on { background:var(--chrome-ink); color:var(--chrome-bg); }
  .wp-bar .dash-btn svg { width:14px; height:14px; }

  /* ── Dashboard ─────────────────────────────────────────────────────────── */
  .live-strip { display:flex; flex-direction:column; gap:.35rem; margin-bottom:1rem; }
  .live-strip div { display:flex; align-items:center; gap:.55rem; background:color-mix(in srgb, var(--pop) 10%, var(--surface));
                    border:1px solid color-mix(in srgb, var(--pop) 40%, var(--line)); border-radius:var(--radius-sm);
                    padding:.5rem .7rem; font-size:.85rem; }
  .live-strip .dot, .cell.live::after { width:8px; height:8px; border-radius:50%; background:var(--pop); flex:0 0 auto;
                    animation:blink 1.4s ease-in-out infinite; }
  .live-strip .stale { background:var(--warn-bg); border-color:color-mix(in srgb, var(--warn) 35%, var(--line)); }
  .live-strip .stale .dot { background:var(--warn); animation:none; }
  @keyframes blink { 50% { opacity:.3; } }
  .toolbar { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin-bottom:.8rem; }
  .chips { display:flex; flex-wrap:wrap; gap:.3rem; }
  .chips button { border:1.5px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:.8rem;
                  font-weight:700; padding:.3rem .7rem; border-radius:99px; cursor:pointer; }
  .chips button span { color:var(--muted); font-weight:600; margin-left:.2rem; }
  .chips button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .chips button[aria-pressed="true"] span { color:inherit; opacity:.8; }
  .toolbar .grow { flex:1; }
  .toolbar input { width:180px; padding:.42rem .7rem; font-size:.85rem; }
  .toolbar select { width:auto; padding:.42rem .6rem; font-size:.85rem; }
  /* The primary action on the dashboard: big, solid, with a hard edge so it
     stands apart from the stat tiles and cohort panels around it. */
  .dash-head { display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap; }
  .new-btn { font-family:var(--font-display); font-weight:var(--display-weight); text-transform:var(--display-case);
             letter-spacing:.04em; font-size:1.5rem; padding:.75rem 1.5rem .75rem 1.1rem; gap:.65rem;
             border:2px solid var(--accent-strong); border-radius:var(--radius);
             box-shadow:0 4px 0 var(--accent-strong), 0 12px 24px -10px rgba(0,0,0,.45); }
  .new-btn:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 5px 0 var(--accent-strong), 0 14px 26px -10px rgba(0,0,0,.45); }
  .new-btn:active:not(:disabled) { transform:translateY(3px); box-shadow:0 1px 0 var(--accent-strong), 0 6px 14px -8px rgba(0,0,0,.4); }
  .new-btn .plus { width:30px; height:30px; border-radius:50%; background:var(--accent-ink); color:var(--accent);
                   display:grid; place-items:center; font-family:var(--font-body); font-weight:800; font-size:1.35rem; line-height:1; }
  .new-btn[aria-expanded="true"] { filter:brightness(.92); }
  .new-cohort { display:flex; gap:.6rem; flex-wrap:wrap; align-items:flex-end; margin-bottom:1rem; padding:1rem 1.1rem;
                background:var(--surface); border:2px solid var(--accent); border-radius:var(--radius); box-shadow:var(--shadow); }
  @media (max-width:560px){ .dash-head .new-btn { width:100%; justify-content:center; } }

  /* No cohorts yet: the whole list area becomes one clear "add your first" panel. */
  .dash.empty .toolbar, .dash.empty .hint { display:none; }
  .first-cohort { text-align:center; padding:2.2rem 1.4rem 2rem; border:2px dashed var(--accent);
                  background:var(--surface); border-radius:var(--radius); }
  .first-cohort .ic { width:72px; height:72px; margin:0 auto .8rem; border-radius:50%; background:var(--accent);
                      color:var(--accent-ink); display:grid; place-items:center; font-size:2.6rem; font-weight:800; line-height:1;
                      box-shadow:0 0 0 8px var(--accent-soft); }
  .first-cohort h2 { font-family:var(--font-display); font-weight:var(--display-weight); text-transform:var(--display-case);
                     letter-spacing:var(--display-track); font-size:2.1rem; line-height:1; color:var(--accent-strong); }
  .first-cohort p { color:var(--muted); max-width:520px; margin:.5rem auto 1.2rem; }
  .first-cohort .add { display:flex; gap:.6rem; max-width:560px; margin:0 auto; flex-wrap:wrap; }
  .first-cohort .add input { flex:1; min-width:200px; font-size:1.05rem; padding:.8rem .9rem; }
  .first-cohort .add .new-btn { font-size:1.35rem; }
  .first-cohort ol { display:flex; justify-content:center; gap:1.4rem; flex-wrap:wrap; list-style:none; margin-top:1.3rem;
                     font-size:.82rem; color:var(--muted); counter-reset:step; }
  .first-cohort ol li { counter-increment:step; display:flex; align-items:center; gap:.4rem; }
  .first-cohort ol li::before { content:counter(step); width:22px; height:22px; border-radius:50%; display:grid; place-items:center;
                                border:1.5px solid var(--accent); color:var(--accent-strong); font-weight:800; font-size:.72rem; }
  .first-cohort ol li:first-child::before { background:var(--accent); color:var(--accent-ink); }

  .cpanel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  .cpanel-head { display:flex; align-items:center; gap:.8rem; padding:.8rem .95rem; flex-wrap:wrap; }
  .cpanel-head .icon { width:42px; height:42px; border-radius:var(--radius-sm); background:var(--accent-soft); color:var(--accent-strong);
                       display:grid; place-items:center; font-family:var(--font-display); font-weight:var(--display-weight); font-size:1.05rem; flex:0 0 auto; }
  .cpanel-head .grow { flex:1; min-width:170px; }
  .cpanel-head .ttl { font-weight:800; font-size:1.05rem; }
  .cpanel-head .sub { font-size:.78rem; color:var(--muted); }
  .cpanel-head .acts { display:flex; gap:.35rem; align-items:center; }
  .cpanel-bar { height:4px; background:var(--surface-2); }
  .cpanel-bar i { display:block; height:100%; background:var(--accent); }
  .pill.warn { background:var(--warn-bg); color:var(--warn); border:1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
  /* Each group is its own tile, keyed by a colour stripe + dot, so groups in the
     same cohort are easy to tell apart at a glance. */
  .gtiles { display:flex; flex-direction:column; gap:.5rem; padding:.75rem .95rem .95rem; }
  .gtile { display:grid; grid-template-columns:minmax(130px,190px) auto 1fr; gap:1rem; align-items:center;
           padding:.65rem .8rem .65rem .95rem; border:1px solid color-mix(in srgb, var(--g) 30%, var(--line));
           border-left:6px solid var(--g); border-radius:var(--radius-sm);
           background:color-mix(in srgb, var(--g) 7%, var(--surface)); }
  .gtile .gname { font-weight:800; font-size:1rem; display:flex; align-items:center; gap:.45rem; min-width:0; }
  .gtile .gname i { width:12px; height:12px; border-radius:50%; background:var(--g); flex:0 0 auto; }
  .gtile .gname small { display:block; color:var(--muted); font-weight:500; font-size:.74rem; }
  .gtile .gname .stale { color:var(--warn); font-weight:700; }
  .gtile .go { justify-self:end; }
  .gtile .go .btn { white-space:nowrap; }
  .gtile .alldone { justify-self:end; font-weight:800; color:var(--g); font-size:.88rem; }
  .cells { display:flex; gap:5px; }
  .cell { width:34px; height:34px; border-radius:var(--radius-sm); border:1.5px solid var(--line); background:var(--surface);
          font:inherit; font-size:.85rem; font-weight:800; color:var(--muted); cursor:pointer; position:relative;
          display:grid; place-items:center; padding:0; transition:transform .1s, border-color .1s; }
  .cell:hover { transform:translateY(-2px); border-color:var(--g, var(--accent-strong)); color:var(--ink); }
  .cell.done { background:var(--g, var(--accent)); border-color:var(--g, var(--accent)); color:#fff; }
  .cell.next { border:2px dashed var(--g, var(--accent-strong)); color:var(--ink); }
  .cell.live { border:2px solid var(--pop); color:var(--pop); }
  .cell.live::after { content:''; position:absolute; top:-4px; right:-4px; }
  @media (max-width:680px){
    .gtile { grid-template-columns:1fr auto; }
    .gtile .cells { grid-column:1 / -1; order:3; }
  }
  .hint { display:flex; align-items:center; gap:.45rem; flex-wrap:wrap; font-size:.8rem; color:var(--muted); margin:.1rem 0 .9rem; }
  .hint .cell { width:20px; height:20px; font-size:.62rem; cursor:default; --g:var(--accent); }
  .hint .cell:hover { transform:none; }

  /* ── Session content (from the Learning Sessions doc) ─────────────────── */
  .outcomes { margin-left:1.1rem; font-size:.88rem; line-height:1.6; display:flex; flex-direction:column; gap:.3rem; }
  .plan { list-style:none; display:flex; flex-direction:column; gap:.55rem; counter-reset:part; }
  .plan li { display:grid; grid-template-columns:28px 1fr; gap:.6rem; align-items:start; counter-increment:part; font-size:.88rem; }
  .plan li::before { content:counter(part); width:28px; height:28px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
                     display:grid; place-items:center; font-weight:800; font-size:.8rem; }
  .plan li small { display:block; color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; font-weight:800; }
  .part-nav { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:1rem; position:sticky; top:2.9rem; z-index:5;
              padding:.4rem 0; background:var(--bg); }
  .part-nav a { display:inline-flex; align-items:center; gap:.4rem; font-size:.82rem; font-weight:700; color:var(--ink);
                text-decoration:none; background:var(--surface); border:1.5px solid var(--line); border-radius:99px; padding:.3rem .75rem .3rem .35rem; }
  .part-nav a:hover { border-color:var(--accent); }
  .part-nav b { width:20px; height:20px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-size:.7rem; }
  .part { margin-bottom:1rem; scroll-margin-top:6rem; }
  .part-head { display:flex; gap:.8rem; align-items:center; margin-bottom:.3rem; }
  .part-n { width:40px; height:40px; border-radius:50%; background:var(--accent); color:var(--accent-ink); flex:0 0 auto;
            display:grid; place-items:center; font-family:var(--font-display); font-weight:var(--display-weight); font-size:1.3rem; }
  .part-l { font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; font-weight:800; color:var(--muted); }
  .part-t { font-family:var(--font-display); font-weight:var(--display-weight); text-transform:var(--display-case);
            letter-spacing:var(--display-track); font-size:1.55rem; line-height:1.05; color:var(--accent-strong); }
  .blk-h { font-weight:800; font-size:.9rem; margin:.6rem 0 .35rem; }
  .blk { margin-left:1.1rem; font-size:.88rem; line-height:1.55; display:flex; flex-direction:column; gap:.3rem; }
  .questions { margin-left:1.3rem; display:flex; flex-direction:column; gap:.45rem; font-size:.95rem; font-weight:600; }
  .questions li::marker { color:var(--accent-strong); font-weight:800; }

  /* Session plan: who you're delivering to (a confirmation, not a question). */
  .deliver-to { background:color-mix(in srgb, var(--g, var(--accent)) 8%, var(--surface));
                border:1px solid color-mix(in srgb, var(--g, var(--accent)) 35%, var(--line));
                border-left:6px solid var(--g, var(--accent)); border-radius:var(--radius); padding:.9rem 1rem 1rem; }
  .dt-row { display:flex; align-items:center; gap:.75rem; margin-bottom:.85rem; }
  .dt-row .gdot { width:14px; height:14px; border-radius:50%; background:var(--g, var(--accent)); flex:0 0 auto; }
  .dt-row .grow { flex:1; min-width:0; }
  .dt-l { font-size:.7rem; text-transform:uppercase; letter-spacing:.09em; font-weight:800; color:var(--muted); }
  .dt-name { font-size:1.15rem; }
  .dt-name .muted { font-size:.85rem; }
  .dt-note { font-size:.8rem; color:var(--warn); font-weight:700; margin-top:.15rem; }
  .dt-note:empty { display:none; }
  .dt-picker { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:.7rem; margin-bottom:.85rem; }

  /* Session plan: switch session for the same group, or open the full list. */
  .sess-switch { display:flex; align-items:center; gap:1rem; flex-wrap:wrap; margin-bottom:1.1rem; padding:.7rem .9rem;
                 background:color-mix(in srgb, var(--g, var(--accent)) 8%, var(--surface));
                 border:1px solid color-mix(in srgb, var(--g, var(--accent)) 35%, var(--line));
                 border-left:6px solid var(--g, var(--accent)); border-radius:var(--radius); }
  .sess-switch .ss-text { min-width:140px; }
  .sess-switch .dt-l span { color:var(--ink); }
  .ss-hint { font-size:.76rem; color:var(--muted); }
  .sess-switch .cells { flex:1; }
  .cell.current { outline:3px solid var(--ink); outline-offset:2px; }
  /* The sessions page's group bar. */
  .se-to { display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; margin:-.4rem 0 1.1rem; padding:.7rem .9rem;
           background:color-mix(in srgb, var(--g, var(--accent)) 8%, var(--surface));
           border:1px solid color-mix(in srgb, var(--g, var(--accent)) 35%, var(--line));
           border-left:6px solid var(--g, var(--accent)); border-radius:var(--radius); }
  .gchips { display:flex; gap:.4rem; flex-wrap:wrap; }
  .gchip { display:inline-flex; align-items:center; gap:.4rem; font:inherit; font-weight:700; font-size:.9rem;
           padding:.35rem .8rem; border-radius:99px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; }
  .gchip i { width:10px; height:10px; border-radius:50%; background:var(--g); }
  .gchip[aria-pressed="true"] { background:var(--g); border-color:var(--g); color:#fff; }
  .gchip[aria-pressed="true"] i { background:#fff; }

  /* ── Worksheets, videos, physical-task capture, resources ────────────── */
  .part-actions { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; margin:.2rem 0 .8rem; }
  .part-actions .btn[aria-disabled="true"] { opacity:.45; pointer-events:none; }
  .done-check { display:inline-flex; align-items:center; gap:.45rem; font-weight:700; font-size:.9rem; cursor:pointer;
                padding:.45rem .75rem; border:1.5px solid var(--line); border-radius:var(--radius-sm); background:var(--surface); }
  .done-check input { width:18px; height:18px; accent-color:var(--accent); }
  .done-check:has(input:checked) { border-color:var(--accent); background:var(--accent-soft); }
  .pvideo { margin:0 0 .9rem; }
  .pvideo iframe, .pvideo video { width:100%; aspect-ratio:16/9; border:0; border-radius:var(--radius); background:#0b1020; display:block; }
  .pvideo .none { aspect-ratio:16/9; display:grid; place-items:center; border-radius:var(--radius);
                  background:#0b1020; color:#8a93b2; font-size:.9rem; }
  .phys-card { display:flex; align-items:center; justify-content:space-between; gap:.8rem; flex-wrap:wrap; }

  .resources { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:.6rem; margin-bottom:1rem; }
  .res { display:flex; align-items:center; gap:.8rem; padding:.75rem .95rem; text-decoration:none; color:var(--ink);
         background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--pop); border-radius:var(--radius); }
  .res:hover { border-color:var(--pop); }
  .res-ic { width:40px; height:40px; flex:0 0 auto; padding:8px; border-radius:var(--radius-sm);
            background:color-mix(in srgb, var(--pop) 14%, var(--surface)); color:var(--pop); }
  .res-t { display:flex; flex-direction:column; gap:.1rem; min-width:0; }
  .res b { font-size:.98rem; }
  .res span { font-size:.8rem; color:var(--muted); }

  .doc-row { display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
  .doc-row .num { width:40px; height:40px; border-radius:var(--radius-sm); background:var(--accent); color:var(--accent-ink);
                  display:grid; place-items:center; font-family:var(--font-display); font-size:1.2rem; flex:0 0 auto; }
  .doc-row .grow { flex:1; min-width:200px; }
  .doc-row .ttl { font-weight:800; }
  .doc-row .sub { font-size:.8rem; color:var(--muted); }
  .doc-row .acts { display:flex; gap:.4rem; flex-wrap:wrap; align-items:center; }

  /* Projector view: full screen, big type, no portal chrome. Prints clean. */
  body.projector { padding:0; }
  body.projector .wp-bar { display:none; }
  .ws { min-height:100vh; background:var(--bg); }
  .ws-bar { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; padding:.7rem 1rem;
            position:sticky; top:0; z-index:5; background:var(--chrome-bg); }
  .ws-bar .grow { flex:1; }
  .ws-bar .btn.secondary { background:rgba(255,255,255,.14); color:var(--chrome-ink); border-color:transparent; }
  .ws-bar .btn[aria-pressed="true"] { background:var(--chrome-ink); color:var(--chrome-bg); }
  @media print {
    body.projector { background:#fff; }
    .ws-bar { display:none; }
    .ws { background:#fff; }
  }

  /* ── Group survey (baseline / final) ─────────────────────────────────── */
  /* Dashboard: B and F squares either side of the six sessions. */
  .cell.sv { width:28px; font-size:.72rem; }
  .cell.sv.missed { opacity:.45; text-decoration:line-through; }
  .cell.sv:disabled { cursor:default; opacity:.5; }
  .cell.sv:disabled:hover { transform:none; border-color:var(--line); color:var(--muted); }
  .cell.locked { opacity:.45; }
  .cells-sep { width:1px; align-self:stretch; margin:3px 2px; background:var(--line); }
  /* Sessions list: survey rows bracket the sessions; locked sessions dim. */
  .session-row .num.sv { background:color-mix(in srgb, var(--g, var(--accent)) 14%, var(--surface)); }
  .session-row.survey-row.next { border:2px dashed var(--g, var(--accent)); }
  .session-row.survey-row.next .num { background:var(--g, var(--accent)); color:#fff; }
  .session-row.survey-row.done .num { background:#d1fae5; border-color:#6ee7b7; color:#065f46; }
  .session-row.survey-row.wait, .session-row.survey-row.missed { opacity:.6; }
  .session-row.survey-row.wait:hover, .session-row.survey-row.missed:hover { transform:none; box-shadow:none; border-color:var(--line); }
  #se-list.locked a.session-row:not(.survey-row) { opacity:.5; }

  .survey { --g:var(--accent); }
  .sv-card { background:var(--surface); border:1px solid var(--line); border-top:6px solid var(--g);
             border-radius:var(--radius); box-shadow:var(--shadow); padding:1.1rem 1.4rem 1.3rem; }
  .sv-top { display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap; font-size:.72rem;
            text-transform:uppercase; letter-spacing:.09em; font-weight:800; color:var(--muted); }
  .sv-bar { height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin:.5rem 0 1.4rem; }
  .sv-bar i { display:block; height:100%; width:0; background:var(--g); transition:width .25s; }
  .sv-q { font-family:var(--font-display); font-weight:var(--display-weight); text-transform:var(--display-case);
          letter-spacing:var(--display-track); font-size:clamp(1.6rem, 3.4vw, 2.5rem); line-height:1.08;
          color:var(--accent-strong); margin-bottom:1.1rem; }
  .sv-help { color:var(--muted); font-size:.9rem; margin:-.5rem 0 1rem; }
  .sv-sub { font-weight:800; font-size:1.05rem; margin:1.2rem 0 .6rem; }
  .sv-details { display:grid; grid-template-columns:repeat(3, 1fr); gap:.7rem; }
  .sv-details .field { margin:0; }
  .sv-who { display:inline-flex; align-items:center; gap:.45rem; padding:.3rem .75rem; border-radius:99px;
            background:color-mix(in srgb, var(--g) 12%, var(--surface)); border:1px solid color-mix(in srgb, var(--g) 40%, var(--line));
            color:var(--ink); font-size:.85rem; letter-spacing:.02em; text-transform:none; }
  .sv-who i { width:10px; height:10px; border-radius:50%; background:var(--g); flex:0 0 auto; }
  .sv-top .sv-step { flex:1; }
  .sv-fact { display:flex; flex-direction:column; gap:.15rem; }
  .sv-fact span { font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; font-weight:800; color:var(--muted); }
  .sv-fact b { font-size:1.05rem; }
  .sv-facts-row { display:flex; align-items:flex-end; gap:1.2rem; flex-wrap:wrap; }
  .sv-link { background:none; border:0; padding:.3rem 0; font:inherit; font-size:.86rem; font-weight:700;
             color:var(--accent-strong); text-decoration:underline; cursor:pointer; }
  .sv-details + .sv-link { margin-top:.5rem; }
  .sv-gap { height:1.2rem; }
  .sv-tally { display:flex; flex-direction:column; gap:.55rem; }
  .sv-trow { display:flex; align-items:center; gap:.9rem; flex-wrap:wrap; padding:.55rem .8rem;
             border:1.5px solid var(--line); border-radius:var(--radius); background:var(--surface); }
  .sv-tl { flex:1; min-width:180px; font-size:1.25rem; font-weight:800; }
  .sv-count { display:inline-flex; align-items:center; gap:.5rem; }
  .sv-stepb { width:52px; height:52px; border-radius:50%; font:inherit; font-size:1.7rem; font-weight:800; line-height:1;
              border:2px solid var(--g); background:var(--surface); color:var(--ink); cursor:pointer; }
  .sv-stepb:hover { background:color-mix(in srgb, var(--g) 12%, var(--surface)); }
  .sv-count input { width:96px; height:58px; font-size:2rem; text-align:center; font-weight:800; font-family:var(--font-display); }
  .sv-rest { font-size:.82rem; }
  .sv-auto { display:none; margin-left:.6rem; font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.08em;
             color:var(--g); vertical-align:middle; }
  .sv-trow.auto .sv-auto { display:inline; }
  .sv-trow.auto { border-style:dashed; border-color:var(--g); }
  .sv-trow.auto .sv-count input { color:var(--g); }
  .sv-total { margin-top:.7rem; font-weight:800; color:var(--muted); }
  .sv-total.over { color:var(--danger); }
  .sv-ans { display:inline-block; margin-right:.8rem; white-space:nowrap; }
  @media (max-width:680px){
    .sv-details { grid-template-columns:1fr; }
    .sv-tl { min-width:100%; }
  }
  .sv-nav { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; margin-top:1.5rem; padding-top:1rem; border-top:1px solid var(--line); }
  .sv-nav .grow { flex:1; }
  .sv-later { font-size:.88rem; color:var(--muted); margin-right:.4rem; }
  .sv-review { list-style:none; display:flex; flex-direction:column; gap:.4rem; }
  /* Question on its own line, its answers underneath, Change to the right. */
  .sv-review li { display:grid; grid-template-columns:1fr auto; grid-template-areas:"q btn" "a btn"; gap:.35rem 1rem;
                  align-items:center; padding:.65rem .8rem; border:1px solid var(--line); border-radius:var(--radius-sm); }
  .sv-review .q { grid-area:q; font-size:.9rem; font-weight:700; }
  .sv-review .a { grid-area:a; display:flex; flex-wrap:wrap; gap:.25rem 1.1rem; }
  .sv-review .a .sv-ans { margin:0; }
  .sv-review li > .btn { grid-area:btn; }
  .sv-result li { grid-template-columns:1fr; grid-template-areas:none; }
  .sv-result .q, .sv-result .a { grid-area:auto; }
  .sv-ar { display:flex; align-items:baseline; gap:.8rem; }
  .sv-ph { flex:0 0 64px; font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; font-weight:800; color:var(--muted); }
  .sv-ar .a { display:flex; flex-wrap:wrap; gap:.25rem 1.1rem; }
  /* Final survey: baseline vs final pies, with a key showing each answer's change. */
  .sv-compare { display:grid; grid-template-columns:auto 1fr; gap:1.2rem; align-items:center; margin-top:.35rem; }
  .sv-compare.no-pies { grid-template-columns:1fr; }
  .sv-pies { display:flex; gap:1rem; }
  .sv-pie { margin:0; display:flex; flex-direction:column; align-items:center; gap:.3rem; }
  .sv-pie .pie { width:104px; height:104px; border-radius:50%; position:relative; display:grid; place-items:center;
                 box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
  .sv-pie .pie span { width:52%; height:52%; border-radius:50%; background:var(--surface); display:grid; place-items:center;
                      font-weight:800; font-size:1rem; }
  .sv-pie figcaption { font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; font-weight:800; color:var(--muted); }
  .sv-key { width:100%; border-collapse:collapse; font-size:.88rem; }
  .sv-key th { font-size:.66rem; text-transform:uppercase; letter-spacing:.08em; font-weight:800; color:var(--muted);
               text-align:left; padding:0 .5rem .3rem 0; background:none; border:0; }
  .sv-key td { padding:.3rem .5rem .3rem 0; border-top:1px solid var(--line); vertical-align:middle; white-space:nowrap; }
  .sv-key td.k { white-space:normal; }
  .sv-key .sw { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:.45rem; vertical-align:-1px;
                box-shadow:inset 0 0 0 1px rgba(0,0,0,.15); }
  .sv-key td.chg, .sv-key th:last-child { text-align:right; padding-right:0; }
  .sv-key td.chg { font-weight:800; }
  .mbar { display:inline-block; width:56px; height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden;
          vertical-align:middle; margin-right:.35rem; }
  .mbar i { display:block; height:100%; }
  .mbar.b i { background:#b9b39a; }
  .mbar.f i { background:var(--accent); }
  .sv-note-li { padding:.4rem .8rem !important; border-style:dashed !important; font-size:.8rem; }
  @media (max-width:640px){
    .sv-compare { grid-template-columns:1fr; }
    .sv-pies { justify-content:center; }
    .sv-key td { white-space:normal; }
    .mbar { display:none; }
  }
  .sv-done { background:color-mix(in srgb, var(--ok) 12%, var(--surface)); border:1px solid color-mix(in srgb, var(--ok) 40%, var(--line));
             color:var(--ok); font-weight:800; border-radius:var(--radius-sm); padding:.6rem .8rem; margin-bottom:1rem; }
  .sv-note { font-size:.8rem; margin-top:.7rem; }
  .sv-card:fullscreen { overflow:auto; padding:5vh 6vw; border-radius:0; }
  .sv-card:fullscreen .sv-q { font-size:clamp(2rem, 4.6vw, 3.8rem); }
  .mc-flash { margin-bottom:.7rem; padding:.55rem .8rem; border-radius:var(--radius-sm); font-weight:700; font-size:.88rem;
              background:color-mix(in srgb, var(--ok) 12%, var(--surface)); border:1px solid color-mix(in srgb, var(--ok) 40%, var(--line)); color:var(--ok); }
  .danger-zone { display:flex; justify-content:space-between; align-items:center; gap:.8rem; flex-wrap:wrap; margin-top:2rem;
                 padding:.9rem 1rem; border:1px solid color-mix(in srgb, var(--danger) 30%, var(--line)); border-radius:var(--radius);
                 font-size:.86rem; }
  .btn.danger-outline { background:var(--surface); color:var(--danger); border:1.5px solid color-mix(in srgb, var(--danger) 50%, var(--line)); }
  .btn.danger-outline:hover { background:color-mix(in srgb, var(--danger) 8%, var(--surface)); }
  .group-head .del-group { color:var(--danger); font-size:.8rem; }
  .cohort-details { display:grid; grid-template-columns:2fr 1.5fr 1.5fr; gap:.8rem; }
  .cohort-details .field { margin:0; }
  @media (max-width:700px){ .cohort-details { grid-template-columns:1fr; } }
  .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .invisible { visibility:hidden; }

  /* ═══ Screen sizes (see demo-theme.css for the shared rules) ═══════════════ */
  /* Touch: bigger targets in the top bar and on the dashboard. */
  @media (pointer:coarse){
    .wp-bar a { padding:.55rem .3rem; }
    .chips button { min-height:40px; padding:.4rem .85rem; }
    .gchip { min-height:42px; }
    .cell { width:38px; height:38px; }
    .cell.sv { width:32px; }
    .roster-item { padding:.62rem .6rem; }
    .part-nav a { padding:.5rem .8rem .5rem .45rem; }
    .done-check { min-height:44px; }
    .group-head input { min-height:40px; }
    .wp-bar .dash-btn { padding:.45rem .75rem; }
    .btn.ghost { min-width:40px; }
    .live-strip a, .sv-later { display:inline-block; padding:.5rem .2rem; }
    .ids-toggle { padding:.45rem 0; }
    .ids-toggle input { width:22px; height:22px; }
  }
  /* Phones: the dashboard gets to your groups sooner. */
  @media (max-width:600px){
    .dash-head .new-btn { width:auto; font-size:1.1rem; padding:.55rem .9rem .55rem .7rem; }
    .dash-head .new-btn .plus { width:24px; height:24px; font-size:1.1rem; }
    .resources { grid-template-columns:1fr 1fr; gap:.5rem; }
    .res { padding:.6rem .7rem; gap:.55rem; }
    .res-ic { width:32px; height:32px; padding:6px; }
    .res b { font-size:.88rem; }
    .res-t span { display:none; }
    .dash .toolbar .chips { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .dash .toolbar .chips button { white-space:nowrap; flex:0 0 auto; }
    .dash .toolbar .chips { width:100%; }
    .dash-head { flex-wrap:nowrap; align-items:center; }
    .dash-head > div { min-width:0; }
    .dash-head .new-btn { flex:0 0 auto; }
    .dash .toolbar input { width:100%; }
    .dash .hint { display:none; }
    .gtiles { padding:.6rem .55rem .7rem; }
    .gtile { padding:.6rem .6rem .7rem .7rem; gap:.6rem; }
    .cells { gap:4px; }
    .cells-sep { margin:3px 1px; }
    .gtile .go { justify-self:stretch; grid-column:1 / -1; order:4; }
    .gtile .go .btn { width:100%; }
    .gtile .gname small, .rail .s, .roster-item .st, .sv-top, .dt-l, .part-l, .sv-fact span, .sv-ph, .sv-key th { font-size:.76rem; }
    .rail .s { font-size:.72rem; }
  }
  /* Phones and small tablets: the pledge page's bottom bar. */
  .dl-mini { display:none; }
  @media (max-width:700px){
    .pledge-page { padding-bottom:4.5rem; }
    .dl-mini { display:flex; align-items:center; gap:.5rem; position:fixed; left:0; right:0; bottom:0; z-index:40;
               padding:.6rem 1rem calc(.6rem + env(safe-area-inset-bottom)); background:var(--surface);
               border-top:1px solid var(--line); box-shadow:0 -8px 24px -12px rgba(0,0,0,.3); }
    .dl-mini .grow { flex:1; min-width:0; font-size:.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .dl-mini .btn { padding:.55rem .85rem; }
    .roster-panel { position:static; scroll-margin-top:4rem; }
  }
  /* Projectors and short screens: the page chrome gives way to the content. */
  @media (max-height:800px) and (min-width:700px){
    body { padding-top:3rem; }
    .rail { margin-bottom:.6rem; }
    .pledge-page .rail, .pledge-page .crumb { display:none; }
    .pledge-page header.page { display:flex; align-items:baseline; gap:.8rem; flex-wrap:wrap; }
    .pledge-page header.page h1 { font-size:1.6rem; order:-1; }
    .roster-list { max-height:calc(100vh - 17rem); }
    .survey header.page .eyebrow, #sv-intro { display:none; }
    .survey header.page h1 { font-size:1.7rem; }
    .sv-card { padding:.8rem 1.2rem 1rem; }
    .sv-bar { margin:.4rem 0 .9rem; }
    .sv-q { font-size:clamp(1.5rem, 3vw, 2.1rem); margin-bottom:.7rem; }
    .sv-trow { padding:.35rem .7rem; }
    .sv-stepb { width:46px; height:46px; }
    .sv-count input { height:50px; }
    .sv-nav { margin-top:.9rem; padding-top:.7rem; }
    .deliver-to .btn.big { padding:.65rem 1.2rem; }
  }

  .hidden { display:none !important; }
</style>
</head>
<body>

<div class="wp-bar">
  <span class="brand"><img src="../public_widget/assets/rugby-ball@2x.png" alt=""><span>Try for Tomorrow</span></span>
  <span class="mode-pill" id="wp-mode"></span>
  <a href="#/dashboard" id="wp-dash" class="dash-btn hidden" title="Your dashboard — every cohort and group at a glance">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
    Dashboard</a>
  <span class="route" id="wp-route"></span>
  <span class="spacer"></span>
  <span id="wp-user"></span>
  <a href="#" id="wp-signout" class="hidden">Sign out</a>
  <a href="../index.html" data-embed-hide>Demo home</a>
</div>

<div id="app"></div>

<!-- ══ 1. LOGIN ═══════════════════════════════════════════════════════════ -->
<template id="v-login">
  <div class="wrap narrow">
    <div class="hero">
      <img src="../public_widget/assets/rugby-ball@2x.png" alt="">
      <h1 class="display">Try for Tomorrow</h1>
      <p>Facilitator sign in</p>
    </div>
    <div class="card">
      <label class="field"><span>Email</span><input type="email" id="li-email" placeholder="you@school.ac.uk" autocomplete="username"></label>
      <label class="field"><span>Password</span><input type="password" id="li-pass" autocomplete="current-password"></label>
      <button class="btn big wide" id="li-go">Sign in</button>
      <div id="li-err" class="hidden" style="color:var(--danger);font-size:.83rem;margin-top:.6rem"></div>
    </div>
    <h2 class="section">Demo accounts</h2>
    <div class="stack" id="li-accounts"></div>
  </div>
</template>

<!-- ══ 2. DASHBOARD — every cohort and group at a glance ═════════════════ -->
<template id="v-dashboard">
  <div class="wrap" style="max-width:70rem">
    <header class="page dash-head">
      <div>
        <div class="eyebrow" id="db-provider"></div>
        <h1>Dashboard</h1>
        <p class="sub" id="db-hello"></p>
      </div>
      <button class="btn new-btn" id="db-newbtn" aria-expanded="false" aria-controls="db-newrow">
        <span class="plus" aria-hidden="true">+</span>New cohort</button>
    </header>

    <!-- Opened by "New cohort". -->
    <div class="new-cohort hidden" id="db-newrow">
      <label class="field" style="margin:0;flex:1;min-width:220px"><span>Name your new cohort</span>
        <input type="text" id="db-new" placeholder="e.g. Year 7 Tag Rugby" aria-label="New cohort name"></label>
      <button class="btn big" id="db-add">Create cohort →</button>
      <button class="btn secondary" id="db-cancel">Cancel</button>
    </div>

    <div class="resources">
      <a class="res" href="#/documents">
        <svg class="res-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
        <span class="res-t"><b>Document hub</b><span>Worksheets to view, print or download</span></span></a>
      <a class="res" href="#/videos">
        <svg class="res-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>
        <span class="res-t"><b>Physical activity videos</b><span>All six activities</span></span></a>
    </div>

    <div class="live-strip" id="db-livestrip"></div>

    <div class="dash">
      <div class="toolbar">
        <div class="chips" id="db-filters" role="group" aria-label="Filter cohorts"></div>
        <span class="grow"></span>
        <input type="search" id="db-search" placeholder="Search…" aria-label="Search cohorts or groups">
      </div>
      <div class="hint">
        <i class="cell done">✓</i> delivered <i class="cell next">4</i> next <i class="cell">5</i> not yet
        <i class="cell sv">B</i> baseline survey <i class="cell sv">F</i> final survey
      </div>
      <div class="stack" id="db-list"></div>
    </div>
  </div>
</template>

<!-- ══ 3. MANAGE ONE COHORT — groups & students ═══════════════════════════ -->
<template id="v-cohort">
  <div class="wrap">
    <div class="crumb"><a href="#" id="mc-crumb">← Dashboard</a></div>
    <header class="page">
      <div class="eyebrow" id="mc-provider"></div>
      <h1 id="mc-title">Cohort</h1>
      <p class="sub">Add groups if you deliver to teams separately.</p>
    </header>

    <div class="card cohort-details" style="margin-bottom:1rem">
      <label class="field"><span>Cohort name</span>
        <input type="text" id="mc-label" placeholder="Cohort name"></label>
      <label class="field"><span>Foundation</span>
        <input type="text" id="mc-foundation" maxlength="120" placeholder="Your Foundation"></label>
      <label class="field"><span>School</span>
        <input type="text" id="mc-school" maxlength="120" placeholder="The school’s name"></label>
    </div>

    <div class="row between" style="margin-bottom:.6rem">
      <h2 class="section" style="margin:0">Groups &amp; students</h2>
      <div class="row" style="gap:.8rem">
        <label class="ids-toggle" title="The pseudonymous ID is the only thing the pledge database ever stores"><input type="checkbox" id="mc-ids"> Show IDs</label>
        <button class="btn secondary" id="mc-addgroup">+ Add group</button>
      </div>
    </div>
    <div class="mc-flash hidden" id="mc-flash" role="status"></div>
    <div class="stack" id="mc-groups"></div>
    <div id="mc-warn" class="hidden" style="margin-top:.8rem;font-size:.82rem;color:var(--warn)"></div>

    <div class="row between" style="margin-top:1.4rem;flex-wrap:wrap;gap:.6rem">
      <span class="muted" style="font-size:.84rem" id="mc-count"></span>
      <button class="btn big" id="mc-done" disabled>Deliver sessions →</button>
    </div>

    <div class="danger-zone">
      <div><strong>Delete this cohort</strong><span class="muted"> · its groups and roster. Pledges and survey answers already recorded are kept.</span></div>
      <button class="btn danger-outline" id="mc-delete">Delete cohort</button>
    </div>
  </div>
</template>

<!-- ══ 4. SESSION SELECTION ═══════════════════════════════════════════════ -->
<template id="v-sessions">
  <div class="wrap">
    <div class="crumb"><a href="#/dashboard">← Dashboard</a></div>
    <header class="page">
      <div class="eyebrow" id="se-provider"></div>
      <h1 id="se-title">Choose a session</h1>
      <p class="sub" id="se-cohort"></p>
    </header>
    <!-- Which group these sessions are for — always on screen, switchable. -->
    <div class="se-to" id="se-to">
      <div class="dt-l">Sessions for</div>
      <div class="gchips" id="se-groups"></div>
    </div>
    <div class="stack" id="se-list"></div>
    <div style="margin-top:1.25rem"><button class="btn secondary" id="se-setup">Manage groups &amp; students</button></div>
  </div>
</template>

<!-- ══ 5. SESSION DETAILS ═════════════════════════════════════════════════ -->
<template id="v-detail">
  <div class="wrap">
    <div class="crumb"><a href="#/dashboard">← Dashboard</a></div>

    <!-- Switch session (for the same group), or open the full list. -->
    <div class="sess-switch" id="sd-switch">
      <div class="ss-text">
        <div class="dt-l">Sessions for <span id="sd-sw-group"></span></div>
        <div class="ss-hint">Tap a number to switch session</div>
      </div>
      <div class="cells" id="sd-sw-cells"></div>
      <a class="btn secondary" id="sd-all" href="#">All sessions →</a>
    </div>
    <div class="rail" id="sd-rail"></div>
    <header class="page">
      <div class="eyebrow" id="sd-eyebrow"></div>
      <h1 id="sd-title"></h1>
      <p class="sub" id="sd-blurb"></p>
    </header>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-bottom:1rem">
      <div class="card">
        <h2 class="section" style="margin-top:0">Learning outcomes</h2>
        <ul class="outcomes" id="sd-outcomes"></ul>
      </div>
      <div class="card">
        <h2 class="section" style="margin-top:0">The session</h2>
        <ol class="plan" id="sd-plan"></ol>
      </div>
    </div>

    <!-- Who this is for: already chosen (from the dashboard, or the sensible default).
         Changing it is a fallback, tucked behind 'Change group'. -->
    <div class="deliver-to" id="sd-to">
      <div class="dt-row">
        <i class="gdot"></i>
        <div class="grow">
          <div class="dt-l">Delivering to</div>
          <div class="dt-name"><strong id="sd-to-name"></strong> <span class="muted" id="sd-to-meta"></span></div>
          <div class="dt-note" id="sd-to-note"></div>
        </div>
        <button class="btn ghost" id="sd-change" aria-expanded="false" aria-controls="sd-picker">Change group</button>
      </div>
      <div class="dt-picker hidden" id="sd-picker">
        <div class="stack" id="sd-groups"></div>
      </div>
      <button class="btn big wide" id="sd-start" disabled>Start session →</button>
    </div>

    <div class="card" style="margin-top:1rem">
      <div class="row between" style="margin-bottom:.4rem">
        <strong style="font-size:.95rem">Previous deliveries</strong>
        <span class="pill none" id="sd-runs-pill">Never run</span>
      </div>
      <div id="sd-runs" class="muted" style="font-size:.85rem">None yet.</div>
    </div>
  </div>
</template>

<!-- ══ 6. RUN THE SESSION — watch & respond, classroom task, physical task ═ -->
<template id="v-video">
  <div class="wrap">
    <div class="crumb"><a href="#" id="vd-back">← Session plan</a></div>
    <div class="rail" id="vd-rail"></div>
    <header class="page">
      <div class="eyebrow" id="vd-eyebrow"></div>
      <h1 id="vd-title">Run the session</h1>
      <p class="sub" id="vd-sub"></p>
    </header>

    <nav class="part-nav" aria-label="Session parts">
      <a href="#" data-part="part-film"><b>1</b> Watch &amp; respond</a>
      <a href="#" data-part="part-classroom"><b>2</b> Classroom task</a>
      <a href="#" data-part="part-physical"><b>3</b> Physical task</a>
      <a href="#" data-part="part-pledge"><b>4</b> Pledge</a>
    </nav>

    <section class="card part" id="part-film">
      <div class="part-head"><span class="part-n">1</span><div><div class="part-l">Watch &amp; respond</div><h2 class="part-t" id="vd-film"></h2></div></div>
      <div class="video-frame" style="margin:.2rem 0 .9rem">
        <div style="text-align:center">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z" fill="currentColor" stroke="none"/>
          </svg>
          <div style="margin-top:.6rem;font-size:.84rem" id="vd-videonote">Video to be added</div>
        </div>
      </div>
      <div class="blk-h">Pause and discuss</div>
      <ol class="questions" id="vd-questions"></ol>
    </section>

    <section class="card part" id="part-classroom">
      <div class="part-head"><span class="part-n">2</span><div><div class="part-l">Classroom task</div><h2 class="part-t" id="vd-classroom"></h2></div></div>
      <div class="part-actions">
        <a class="btn secondary" id="vd-ws-view" href="#">Worksheet on screen</a>
        <a class="btn secondary" id="vd-ws-download" href="#" download>Download worksheet</a>
      </div>
      <div id="vd-classroom-body"></div>
    </section>

    <section class="card part" id="part-physical">
      <div class="part-head"><span class="part-n">3</span><div><div class="part-l">Physical task</div><h2 class="part-t" id="vd-physical"></h2></div></div>
      <div class="part-actions">
        <button class="btn secondary" id="vd-pv-toggle" aria-expanded="false" aria-controls="vd-pv">Watch video</button>
        <label class="done-check"><input type="checkbox" id="vd-physical-done"> We did the physical task</label>
      </div>
      <div class="pvideo hidden" id="vd-pv"></div>
      <div id="vd-physical-body"></div>
    </section>

    <section class="card part" id="part-pledge">
      <div class="part-head"><span class="part-n">4</span><div><div class="part-l">Pledge to the planet</div><h2 class="part-t" id="vd-question"></h2></div></div>
      <p style="font-weight:700;font-size:.9rem" id="vd-citizen"></p>
      <button class="btn big wide" id="vd-next" style="margin-top:.9rem">Continue to pledges →</button>
    </section>
  </div>
</template>

<!-- ══ 7. PLEDGE CAPTURE ══════════════════════════════════════════════════ -->
<template id="v-pledge">
  <div class="wrap pledge-page" style="max-width:67.5rem">
    <div class="crumb"><a href="#" id="dl-back">← Video</a> · <span id="dl-crumb"></span></div>
    <div class="rail" id="dl-rail"></div>
    <header class="page">
      <div class="eyebrow" id="dl-eyebrow"></div>
      <h1>Pledge time</h1>
    </header>
    <div class="deliver">
      <div class="roster-panel">
        <div class="row between">
          <strong id="dl-groupname">Students</strong>
          <span class="pill live" id="dl-progress">0 / 0</span>
        </div>
        <div class="bar-track" style="margin-top:.55rem"><div class="bar-fill" id="dl-bar" style="width:0%"></div></div>
        <div class="roster-list" id="dl-roster"></div>
        <div class="all-done hidden" id="dl-alldone">Everyone’s had a turn.</div>
        <button class="btn wide" id="dl-finish" style="margin-top:.8rem">Finish session</button>
      </div>
      <div>
        <div class="embed">
          <span class="embed-tab">Pledge widget</span>
          <iframe class="widget-frame" id="dl-frame" title="Pledge widget"></iframe>
        </div>
      </div>
    </div>
    <!-- Phones: the roster sits below the widget, so progress, who's next and
         Finish stay in reach at the bottom of the screen. -->
    <div class="dl-mini" id="dl-mini">
      <div class="grow"><strong id="dl-mini-count">0 / 0</strong> <span id="dl-mini-next"></span></div>
      <button class="btn secondary" id="dl-mini-roster">Students</button>
      <button class="btn" id="dl-mini-finish">Finish</button>
    </div>
  </div>
</template>

<!-- ══ 8. COMPLETE ════════════════════════════════════════════════════════ -->
<template id="v-complete">
  <div class="wrap narrow">
    <div class="rail" id="cp-rail"></div>
    <div class="card done-hero">
      <img src="../public_widget/assets/rugby-ball@2x.png" alt="">
      <h1 class="display" id="cp-title">Session complete</h1>
      <p class="muted" style="font-size:.92rem;margin-bottom:1.2rem" id="cp-sub"></p>
      <div class="stats">
        <div class="stat"><div class="n" id="cp-pledges">0</div><div class="l">Pledges</div></div>
        <div class="stat"><div class="n" id="cp-of">0</div><div class="l">In the group</div></div>
        <div class="stat"><div class="n" id="cp-own">0</div><div class="l">Own ideas</div></div>
      </div>
    </div>

    <div class="card" style="margin-top:1rem" id="cp-bk-card">
      <h2 class="section" style="margin-top:0">What the group pledged</h2>
      <div class="breakdown" id="cp-breakdown"><div class="muted" style="font-size:.85rem">Loading…</div></div>
      <div id="cp-own-wrap" class="hidden" style="margin-top:.9rem">
        <div style="font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em">Their own ideas</div>
        <div class="own-list" id="cp-own-list"></div>
      </div>
    </div>

    <div class="card phys-card" style="margin-top:1rem">
      <div><strong>Physical task</strong> <span class="muted" id="cp-physical-title"></span></div>
      <label class="done-check"><input type="checkbox" id="cp-physical-done"> Done</label>
    </div>

    <div class="card next-card" style="margin-top:1rem" id="cp-next-card">
      <div class="num" id="cp-next-num">2</div>
      <div style="flex:1;min-width:0">
        <div class="muted" style="font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em">Up next</div>
        <div style="font-weight:800" id="cp-next-title"></div>
      </div>
      <button class="btn" id="cp-next">Plan it →</button>
    </div>

    <div class="row" style="gap:.6rem;margin-top:1rem">
      <button class="btn secondary" id="cp-cohorts" style="flex:1">Dashboard</button>
      <button class="btn secondary" id="cp-back" style="flex:1">Back to sessions</button>
    </div>
  </div>
</template>

<!-- ══ GROUP SURVEY — baseline / final ════════════════════════════════════ -->
<template id="v-survey">
  <div class="wrap survey">
    <div class="crumb"><a href="#" id="sv-crumb">← All sessions</a></div>
    <header class="page">
      <div class="eyebrow" id="sv-eyebrow"></div>
      <h1 id="sv-title"></h1>
      <p class="sub" id="sv-intro"></p>
    </header>
    <div class="sv-card">
      <div class="sv-top">
        <span class="sv-who"><i></i><span id="sv-who"></span></span>
        <span class="sv-step" id="sv-stepname"></span>
        <button class="btn ghost" id="sv-full">Full screen</button>
      </div>
      <div class="sv-bar"><i id="sv-progress"></i></div>
      <div id="sv-body"><div class="muted">Loading…</div></div>
      <div class="sv-nav" id="sv-nav">
        <button class="btn secondary" id="sv-back">← Back</button>
        <span class="grow"></span>
        <a href="#" class="sv-later" id="sv-later">Not now</a>
        <button class="btn big" id="sv-next" disabled>Next →</button>
      </div>
    </div>
    <p class="muted sv-note hidden" id="sv-placeholder">Placeholder questions until the evaluation team’s survey is added.</p>
  </div>
</template>

<!-- ══ DOCUMENT HUB ══════════════════════════════════════════════════════ -->
<template id="v-documents">
  <div class="wrap">
    <div class="crumb"><a href="#/dashboard">← Dashboard</a></div>
    <header class="page">
      <div class="eyebrow">Resources</div>
      <h1>Document hub</h1>
      <p class="sub">Classroom worksheets for all six sessions.</p>
    </header>
    <div class="stack" id="dh-list"></div>
  </div>
</template>

<!-- ══ PHYSICAL ACTIVITY VIDEOS ══════════════════════════════════════════ -->
<template id="v-videos">
  <div class="wrap">
    <div class="crumb"><a href="#/dashboard">← Dashboard</a></div>
    <header class="page">
      <div class="eyebrow">Resources</div>
      <h1>Physical activity videos</h1>
      <p class="sub">Videos stay hidden until you choose to play one.</p>
    </header>
    <div class="stack" id="pv-list"></div>
  </div>
</template>

<!-- ══ WORKSHEET — projector view ════════════════════════════════════════ -->
<template id="v-worksheet">
  <div class="ws">
    <div class="ws-bar">
      <a href="#" class="btn secondary" id="ws-back">← Back</a>
      <span class="grow"></span>
      <button class="btn secondary hidden" id="ws-answers" aria-pressed="false">Show answers</button>
      <button class="btn secondary" id="ws-print">Print</button>
      <a class="btn secondary" id="ws-download" href="#" download>Download</a>
