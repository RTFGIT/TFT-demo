<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Try for Tomorrow — Facilitator Portal</title>
<link rel="stylesheet" href="../demo-theme.css">
<style>
  /* ─────────────────────────────────────────────────────────────────────────
     WORDPRESS COMPATIBILITY
     Each screen is a separate hash route mapping 1:1 to a WordPress permalink
     (see WP_ROUTES in wp-emulator.js). Every view renders from server-supplyable
     data, so each could become its own WP page template with the same markup.
     ───────────────────────────────────────────────────────────────────────── */
  body { background:#eef2f7; padding-top:3.2rem; }
  .wp-bar { position:fixed; top:0; left:0; right:0; height:34px; background:#1d2327;
            color:#c3c4c7; font-size:.78rem; display:flex; align-items:center;
            gap:1rem; padding:0 1rem; z-index:50; }
  .wp-bar .brand { font-weight:700; color:#fff; }
  .wp-bar .spacer { flex:1; }
  .wp-bar a { color:#72aee6; text-decoration:none; }
  .wp-bar a:hover { text-decoration:underline; }
  .wp-bar .route { font-family:ui-monospace,Consolas,monospace; color:#8c8f94; font-size:.72rem; }
  /* Phones: drop the permalink + user so the "Demo home" / sign-out links stay reachable. */
  @media (max-width:640px){ .wp-bar { gap:.7rem; } .wp-bar .route, #wp-user { display:none; } }

  .rail { display:flex; align-items:center; gap:.4rem; margin-bottom:1.25rem; flex-wrap:wrap; }
  .rail .s { display:flex; align-items:center; gap:.35rem; font-size:.74rem; color:var(--muted); font-weight:600; }
  .rail .s .dot { width:20px; height:20px; border-radius:50%; background:#fff; border:1.5px solid var(--line);
                  display:grid; place-items:center; font-size:.66rem; }
  .rail .s.on  .dot { background:var(--accent); border-color:var(--accent); color:#fff; }
  .rail .s.on  { color:var(--accent); }
  .rail .s.done .dot { background:#d1fae5; border-color:#6ee7b7; color:#065f46; }
  .rail .bar { flex:1; min-width:12px; height:1.5px; background:var(--line); }

  /* ── Cohort cards ──────────────────────────────────────────────────────── */
  .cohort-card { display:flex; align-items:center; gap:1rem; padding:1rem 1.1rem;
                 border:1px solid var(--line); border-radius:12px; background:#fff; }
  .cohort-card .icon { width:42px; height:42px; border-radius:11px; background:#eef2ff; color:#3730a3;
                       display:grid; place-items:center; flex:0 0 auto; }
  .cohort-card .grow { flex:1; min-width:0; }
  .cohort-card .ttl { font-weight:700; font-size:1.02rem; }
  .cohort-card .sub { font-size:.8rem; color:var(--muted); margin-top:.1rem; }
  .cohort-card .acts { display:flex; gap:.4rem; flex-wrap:wrap; justify-content:flex-end; }

  /* ── Sessions ──────────────────────────────────────────────────────────── */
  .session-row { display:flex; align-items:center; gap:.9rem; padding:.9rem 1rem;
                 border:1px solid var(--line); border-radius:12px; background:#fff;
                 text-decoration:none; color:inherit; transition:transform .1s, box-shadow .1s; }
  .session-row:hover { transform:translateY(-1px); box-shadow:var(--shadow); }
  .session-row .num { width:38px; height:38px; border-radius:10px; background:#eef2ff;
                      color:#3730a3; display:grid; place-items:center; font-weight:700; flex:0 0 auto; }
  .session-row .grow { flex:1; min-width:0; }
  .session-row .ttl { font-weight:600; }
  .session-row .sub { font-size:.78rem; color:var(--muted); }
  .grp-dots { display:flex; gap:3px; }
  .grp-dots i { width:7px; height:7px; border-radius:50%; background:var(--line); display:block; }
  .grp-dots i.done { background:var(--ok); }

  /* ── Groups & students ─────────────────────────────────────────────────── */
  .group-card { border:1px solid var(--line); border-radius:12px; background:#fff; overflow:hidden; }
  .group-head { display:flex; align-items:center; gap:.6rem; padding:.6rem .85rem;
                background:#f8fafc; border-bottom:1px solid var(--line); }
  .group-head input { border:1px solid transparent; background:transparent; font-weight:700;
                      padding:.2rem .35rem; border-radius:6px; flex:1; }
  .group-head input:hover { border-color:var(--line); background:#fff; }
  .group-body { padding:.6rem .85rem; display:flex; flex-direction:column; gap:.4rem; }
  .stu { display:flex; align-items:center; gap:.55rem; }
  .stu .av { width:26px; height:26px; border-radius:50%; background:#e0e7ff; color:#3730a3;
             display:grid; place-items:center; font-size:.72rem; font-weight:700; flex:0 0 auto; }
  .stu .nm { flex:1; font-size:.87rem; }
  .stu .x { border:none; background:transparent; color:var(--muted); cursor:pointer;
            font-size:1rem; line-height:1; padding:.1rem .3rem; border-radius:5px; }
  .stu .x:hover { background:#fee2e2; color:var(--danger); }
  .add-row { display:flex; gap:.4rem; margin-top:.2rem; }
  .add-row input { flex:1; padding:.42rem .6rem; font-size:.87rem; }

  .video-frame { aspect-ratio:16/9; background:#0f172a; border-radius:12px;
                 display:grid; place-items:center; color:#64748b; border:1px solid var(--line); }

  .deliver { display:grid; grid-template-columns:minmax(210px,280px) 1fr; gap:1rem; align-items:start; }
  @media (max-width:820px){ .deliver { grid-template-columns:1fr; } }
  .roster-item { display:flex; align-items:center; gap:.55rem; padding:.45rem .6rem;
                 border-radius:9px; border:1px solid var(--line); background:#fff; }
  .roster-item.done { opacity:.5; }
  .roster-item.active { border-color:var(--accent); box-shadow:0 0 0 2px rgba(37,99,235,.14); }
  .roster-item .nm { flex:1; font-size:.86rem; }
  .roster-item .av { width:26px; height:26px; border-radius:50%; background:#e0e7ff;
                     color:#3730a3; display:grid; place-items:center; font-size:.72rem; font-weight:700; }
  iframe.widget-frame { width:100%; border:none; display:block; min-height:540px; border-radius:8px; background:#fff; }
  /* The embedded-widget boundary: makes the WordPress ↔ GitHub-Pages seam visible. */
  .embed { border:2px dashed #3b82f6; border-radius:12px; padding:.55rem; background:#f5f9ff; position:relative; }
  .embed-tab { position:absolute; top:-11px; left:14px; background:#2563eb; color:#fff;
               font-size:.66rem; font-weight:700; padding:.12rem .55rem; border-radius:6px; letter-spacing:.03em; }
  .embed-url { font-family:ui-monospace,Consolas,monospace; font-size:.66rem; color:#1e40af;
               background:#e0edff; border-radius:6px; padding:.28rem .5rem; margin-bottom:.5rem;
               overflow-x:auto; white-space:nowrap; }
  .embed-note { font-size:.74rem; color:var(--muted); margin-top:.5rem; }
  .hidden { display:none !important; }
</style>
</head>
<body>

<div class="wp-bar">
  <span class="brand">⊞ tryfortomorrow.org</span>
  <span class="route" id="wp-route"></span>
  <span class="spacer"></span>
  <span id="wp-user"></span>
  <a href="#" id="wp-signout" class="hidden">Sign out</a>
  <a href="../index.html">← Demo home</a>
</div>

<div id="app"></div>

<!-- ══ 1. LOGIN ═══════════════════════════════════════════════════════════ -->
<template id="v-login">
  <div class="wrap narrow">
    <header class="page">
      <div class="eyebrow">Facilitator Portal</div>
      <h1>Sign in</h1>
      <p class="sub">Stands in for your WordPress login. Student names live here and never travel onward.</p>
    </header>
    <div class="card">
      <label class="field"><span>Email</span><input type="email" id="li-email" placeholder="alex@democollege.ac.uk"></label>
      <label class="field"><span>Password</span><input type="password" id="li-pass" placeholder="demo"></label>
      <button class="btn" id="li-go" style="width:100%">Sign in</button>
      <div id="li-err" class="hidden" style="color:var(--danger);font-size:.83rem;margin-top:.6rem"></div>
    </div>
    <h2 class="section">Demo accounts</h2>
    <table><thead><tr><th>Email</th><th>Password</th><th>Provider</th></tr></thead><tbody id="li-accounts"></tbody></table>
    <p class="muted" style="font-size:.78rem;margin-top:.7rem">
      Two or more facilitators may sign in with the same account on different devices at once —
      each works with a different cohort or group.
    </p>
  </div>
</template>

<!-- ══ 2. COHORTS ═════════════════════════════════════════════════════════ -->
<template id="v-cohorts">
  <div class="wrap">
    <header class="page">
      <div class="eyebrow" id="co-provider"></div>
      <h1>Cohorts</h1>
      <p class="sub">A cohort is a class, year group, school or club — like “Year 9 Rugby” or “Castleford RFL Juniors”. Add one per group you run the programme with.</p>
    </header>
    <div class="emulation-note">
      <strong>Emulated boundary.</strong> Student names live on the WordPress side only
      (<code>tft26_wp_emulator_v1</code>). The pledge database only ever sees a pseudonymous ID.
      Verify with <code>__wp.boundaryReport()</code>.
    </div>

    <div class="card" style="margin-bottom:1rem">
      <div class="row" style="align-items:flex-end;gap:.5rem">
        <label class="field" style="flex:1;margin-bottom:0"><span>New cohort name</span>
          <input type="text" id="co-new" placeholder="e.g. Year 9 Rugby"></label>
        <button class="btn" id="co-add">Create cohort</button>
      </div>
    </div>

    <div class="stack" id="co-list"></div>
  </div>
</template>

<!-- ══ 3. MANAGE ONE COHORT — groups & students ═══════════════════════════ -->
<template id="v-cohort">
  <div class="wrap">
    <div class="crumb"><a href="#" id="mc-crumb">← All cohorts</a></div>
    <header class="page">
      <div class="eyebrow" id="mc-provider"></div>
      <h1 id="mc-title">Cohort</h1>
      <p class="sub">One group holds the whole cohort. Add groups to split it into teams — Boys / Girls, age brackets, or smaller units so two facilitators can each take a group.</p>
    </header>

    <div class="card" style="margin-bottom:1rem">
      <label class="field" style="margin-bottom:0"><span>Cohort name</span>
        <input type="text" id="mc-label" placeholder="Cohort name"></label>
    </div>

    <div class="row between" style="margin-bottom:.6rem">
      <h2 class="section" style="margin:0">Groups &amp; students</h2>
      <button class="btn secondary" id="mc-addgroup">+ Add group</button>
    </div>
    <div class="stack" id="mc-groups"></div>
    <div id="mc-warn" class="hidden" style="margin-top:.8rem;font-size:.82rem;color:var(--warn)"></div>

    <div class="row between" style="margin-top:1.4rem;flex-wrap:wrap;gap:.6rem">
      <span class="muted" style="font-size:.84rem" id="mc-count"></span>
      <button class="btn" id="mc-done" disabled>Deliver sessions →</button>
    </div>
  </div>
</template>

<!-- ══ 4. SESSION SELECTION ═══════════════════════════════════════════════ -->
<template id="v-sessions">
  <div class="wrap">
    <div class="crumb"><a href="#" id="se-crumb">← Cohorts</a></div>
    <header class="page">
      <div class="eyebrow" id="se-provider"></div>
      <h1 id="se-title">Choose a session</h1>
      <p class="sub" id="se-cohort"></p>
    </header>
    <div class="stats" style="margin-bottom:1.4rem">
      <div class="stat"><div class="n" id="se-students">0</div><div class="l">Students</div></div>
      <div class="stat"><div class="n" id="se-groups">0</div><div class="l">Groups</div></div>
      <div class="stat"><div class="n" id="se-runs">0</div><div class="l">Deliveries</div></div>
      <div class="stat"><div class="n" id="se-pledges">0</div><div class="l">Pledges</div></div>
    </div>
    <div class="stack" id="se-list"></div>
    <div style="margin-top:1.25rem"><button class="btn secondary" id="se-setup">Manage groups &amp; students</button></div>
  </div>
</template>

<!-- ══ 5. SESSION DETAILS ═════════════════════════════════════════════════ -->
<template id="v-detail">
  <div class="wrap">
    <div class="crumb"><a href="#" id="sd-crumb">← All sessions</a></div>
    <div class="rail" id="sd-rail"></div>
    <header class="page">
      <div class="eyebrow" id="sd-eyebrow"></div>
      <h1 id="sd-title"></h1>
      <p class="sub" id="sd-blurb"></p>
    </header>

    <div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:1rem">
      <div class="card">
        <h2 class="section" style="margin-top:0">What students will do</h2>
        <ul id="sd-objectives" style="font-size:.87rem;line-height:1.75;margin-left:1rem"></ul>
        <div class="muted" style="font-size:.8rem;margin-top:.5rem" id="sd-duration"></div>
      </div>
      <div class="card">
        <h2 class="section" style="margin-top:0">Thematic question</h2>
        <div id="sd-question" style="font-weight:600;font-size:.95rem"></div>
        <div class="muted" style="font-size:.8rem;margin-top:.5rem" id="sd-prompt"></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:1rem">
      <h2 class="section" style="margin-top:0">Which group are you delivering to?</h2>
      <div class="stack" id="sd-groups"></div>
      <div class="muted" style="font-size:.76rem;margin-top:.6rem">
        A group marked <span class="pill live">in progress</span> is being delivered right now on another device.
      </div>
    </div>

    <div class="card">
      <div class="row between" style="margin-bottom:.4rem">
        <strong style="font-size:.95rem">Previous deliveries</strong>
        <span class="pill none" id="sd-runs-pill">Never run</span>
      </div>
      <div id="sd-runs" class="muted" style="font-size:.85rem">Not yet delivered to any group.</div>
    </div>

    <div style="margin-top:1.25rem">
      <button class="btn" id="sd-start" style="width:100%" disabled>Start session →</button>
    </div>
  </div>
</template>

<!-- ══ 6. VIDEO ═══════════════════════════════════════════════════════════ -->
<template id="v-video">
  <div class="wrap">
    <div class="crumb"><a href="#" id="vd-back">← Session details</a></div>
    <div class="rail" id="vd-rail"></div>
    <header class="page">
      <div class="eyebrow" id="vd-eyebrow"></div>
      <h1>Watch together</h1>
      <p class="sub" id="vd-sub"></p>
    </header>
    <div class="video-frame" style="margin-bottom:1rem">
      <div style="text-align:center">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z" fill="#475569" stroke="none"/>
        </svg>
        <div style="margin-top:.6rem;font-size:.84rem" id="vd-videonote">Placeholder — no video URL set for this session</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:1rem">
      <h2 class="section" style="margin-top:0">Coming up next</h2>
      <div style="font-weight:600;font-size:.95rem" id="vd-question"></div>
      <div class="muted" style="font-size:.82rem;margin-top:.35rem">
        After the video, each student answers this one at a time on the shared device.
      </div>
    </div>
    <button class="btn" id="vd-next" style="width:100%">Continue to pledges →</button>
  </div>
</template>

<!-- ══ 7. PLEDGE CAPTURE ══════════════════════════════════════════════════ -->
<template id="v-pledge">
  <div class="wrap">
    <div class="crumb"><a href="#" id="dl-back">← Video</a> · <span id="dl-crumb"></span></div>
    <div class="rail" id="dl-rail"></div>
    <header class="page">
      <div class="eyebrow" id="dl-eyebrow"></div>
      <h1>Collect pledges</h1>
      <p class="sub">Select a student, hand them the device, then choose the next.</p>
    </header>
    <div class="deliver">
      <div>
        <div class="row between" style="margin-bottom:.5rem">
          <h2 class="section" style="margin:0" id="dl-groupname">Students</h2>
          <span class="pill live" id="dl-progress">0 / 0</span>
        </div>
        <div class="stack" id="dl-roster"></div>
        <button class="btn" id="dl-finish" style="width:100%;margin-top:.9rem">Finish session</button>
        <p class="muted" style="font-size:.75rem;margin-top:.5rem">
          You can finish early — anyone not yet pledged is simply left out of this run.
        </p>
      </div>
      <div>
        <div class="embed">
          <span class="embed-tab">◈ EMBEDDED WIDGET · GitHub Pages</span>
          <div class="embed-url" id="dl-embed-url"></div>
          <iframe class="widget-frame" id="dl-frame" title="Pledge widget"></iframe>
        </div>
        <div class="embed-note">
          Everything outside the dashed frame is your WordPress site (emulated here). The frame is the
          embeddable widget — the only part served from GitHub Pages, that talks to Firebase, and that
          never sees a name. <a href="../integration.html" target="_blank">How it embeds →</a>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- ══ 8. COMPLETE ════════════════════════════════════════════════════════ -->
<template id="v-complete">
  <div class="wrap narrow">
    <div class="rail" id="cp-rail"></div>
    <div class="card" style="text-align:center;padding:2rem 1.5rem">
      <svg width="58" height="58" viewBox="0 0 52 52" fill="none" style="margin-bottom:.8rem">
        <circle cx="26" cy="26" r="24" stroke="#059669" stroke-width="3" opacity=".25"/>
        <path d="M15 27l8 8 15-16" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1 style="font-size:1.4rem;margin-bottom:.3rem" id="cp-title">Session complete</h1>
      <p class="muted" style="font-size:.92rem;margin-bottom:1.2rem" id="cp-sub"></p>
      <div class="stats" style="margin-bottom:1.4rem">
        <div class="stat"><div class="n" id="cp-pledges">0</div><div class="l">Pledges captured</div></div>
        <div class="stat"><div class="n" id="cp-of">0</div><div class="l">Students in group</div></div>
      </div>
      <div class="row" style="gap:.6rem">
        <button class="btn secondary" id="cp-cohorts" style="flex:1">All cohorts</button>
        <button class="btn" id="cp-back" style="flex:1">Back to sessions</button>
      </div>
    </div>
  </div>
</template>

<script type="module" src="./facilitator-app.js"></script>
</body>
</html>
