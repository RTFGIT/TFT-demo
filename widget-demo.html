<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="auth-gate.js"></script>
<script src="embed-frame.js"></script>
<title>Pledge widget</title>
<link rel="stylesheet" href="demo-theme.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300;1,600&display=swap">
<style>
  /* Demo page: the real widget in a frame, plus a separate control that only
     plays the kick animation. The control is NOT part of the widget and is
     never deployed with it — it reaches into the (same-origin) frame and calls
     the widget's own animation, so nothing is saved. */
  .layout { display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:1.1rem; align-items:start; }
  @media (max-width:820px){ .layout { grid-template-columns:1fr; } .layout .trigger { order:-1; } }
  iframe.w { width:100%; border:none; display:block; min-height:560px; background:transparent; }
  .trigger { position:sticky; top:1rem; }
  .trigger .btn { width:100%; }
</style>
</head>
<body>
<div class="wrap" style="max-width:64rem">
  <div class="crumb" data-embed-hide><a href="index.html">← Demo home</a></div>
  <header class="page">
    <h1>Pledge widget</h1>
  </header>

  <div class="layout">
    <iframe class="w" id="w" title="Pledge widget" allow="autoplay"
            src="public_widget/pledge-widget.html?session=1&amp;ref=p_demo0001&amp;mode_once=sandbox"></iframe>

    <aside class="card trigger">
      <h2 class="section" style="margin-top:0">Animation test</h2>
      <button class="btn big" id="kick" disabled>Submit pledge</button>
      <p class="muted" style="font-size:.78rem;margin-top:.6rem">Plays the kick. Nothing is saved.</p>
    </aside>
  </div>
</div>

<script>
  const frame = document.getElementById('w');
  const btn = document.getElementById('kick');
  const scene = () => { try { return frame.contentWindow.__kick || null; } catch { return null; } };

  // Enable once the widget has loaded its kick scene.
  window.addEventListener('message', (e) => {
    const t = e.data && e.data.type;
    if (t === 'TFT_HEIGHT') frame.style.height = e.data.height + 'px';
    if (t === 'TFT_WIDGET_READY' && scene()) btn.disabled = false;
  });

  frame.addEventListener('load', () => setTimeout(() => { if (scene()) btn.disabled = false; }, 300));

  btn.addEventListener('click', () => {
    const k = scene();
    if (!k) return;
    k.kick();
    btn.disabled = true;                       // one kick at a time
    setTimeout(() => { btn.disabled = false; }, 2700);
  });
</script>
</body>
</html>
