<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Try for Tomorrow — Pledge Widget</title>
<style>
  /* ─────────────────────────────────────────────────────────────────────────
     The merged pledge widget: capture form + run counter in ONE surface.

     In JOM these were two separate iframes coordinated by postMessage, because
     the counter was a public engagement device that lived elsewhere on the page.
     Here they are one component — a facilitator-led capture endpoint where the
     counter's job is to give the room immediate feedback that a pledge landed.

     Presentation is redesigned from scratch. All artwork is placeholder SVG and
     there is exactly ONE token design, enough to prove the interaction works.
     ───────────────────────────────────────────────────────────────────────── */
  :root {
    --ink:#12212e; --muted:#64748b; --line:#e2e8f0; --surface:#fff;
    --accent:#2563eb; --accent-2:#0ea5e9; --ok:#059669; --warn-bg:#fffbeb;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',system-ui,sans-serif; color:var(--ink); background:transparent; }

  .widget { max-width:720px; margin:0 auto; background:var(--surface);
            border:1px solid var(--line); border-radius:16px; overflow:hidden;
            box-shadow:0 1px 3px rgba(18,33,46,.06), 0 8px 24px rgba(18,33,46,.06); }

  /* ── Counter strip ─────────────────────────────────────────────────────── */
  .counter { position:relative; background:linear-gradient(160deg,#1e293b,#0f172a);
             color:#fff; padding:1.1rem 1.25rem 0; overflow:hidden; }
  .counter-head { display:flex; justify-content:space-between; align-items:flex-start;
                  position:relative; z-index:2; }
  .counter-label { font-size:.68rem; text-transform:uppercase; letter-spacing:.1em;
                   color:#94a3b8; font-weight:700; }
  .counter-n { font-size:2.4rem; font-weight:700; line-height:1; letter-spacing:-.02em;
               transition:transform .3s cubic-bezier(.34,1.56,.64,1); }
  .counter-n.bump { transform:scale(1.16); }
  .counter-sub { font-size:.75rem; color:#94a3b8; margin-top:.15rem; }
  .session-chip { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16);
                  border-radius:99px; padding:.25rem .7rem; font-size:.72rem; font-weight:600; }

  /* ── The pitch: rugby posts a ball is kicked over (a conversion) ───────── */
  .pitch { position:relative; height:118px; margin-top:.5rem; overflow:hidden; }
  .pitch .ground { position:absolute; left:0; right:0; bottom:0; height:22px;
                   background:linear-gradient(180deg, rgba(52,211,153,.14), rgba(52,211,153,.04));
                   border-top:1px solid rgba(110,231,183,.35); }
  /* The H posts — two tall uprights + a crossbar — standing on the ground. */
  .posts { position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
           width:96px; height:104px; color:#e2e8f0; opacity:.9;
           transition:filter .18s ease, opacity .18s ease; }
  .posts.flash { filter:drop-shadow(0 0 7px rgba(125,211,252,.9)); opacity:1; }

  /* Kick: an X-wrapper moves the ball across, an inner arc-wrapper carries it
     up and over the crossbar, and the ball itself spins. Three nested elements
     so each animates a different property without transform conflicts. */
  .kick { position:absolute; bottom:22px; left:9%; z-index:3;
          animation:kick-x 1.15s cubic-bezier(.3,0,.7,1) forwards; }
  .kick .arc { animation:kick-arc 1.15s cubic-bezier(.2,.5,.5,1) forwards; }
  .kick .ball { display:block; width:30px; height:30px;
                animation:kick-spin 1.15s linear forwards; }
  @keyframes kick-x   { from { left:9%; } to { left:82%; } }
  @keyframes kick-arc {
    0%   { transform:translateY(0)     scale(1);   opacity:0; }
    10%  { opacity:1; }
    45%  { transform:translateY(-98px) scale(.9); }
    100% { transform:translateY(-52px) scale(.6);  opacity:.75; }
  }
  @keyframes kick-spin { from { transform:rotate(-24deg); } to { transform:rotate(320deg); } }

  @media (prefers-reduced-motion: reduce) {
    .kick, .kick .arc, .kick .ball { animation-duration:.01s; }
  }

  /* ── Body ──────────────────────────────────────────────────────────────── */
  .body { padding:1.35rem 1.35rem 1.5rem; }
  .who { display:flex; align-items:center; gap:.6rem; background:#f8fafc;
         border:1px solid var(--line); border-radius:11px; padding:.6rem .8rem; margin-bottom:1rem; }
  .who .avatar { width:32px; height:32px; border-radius:50%; background:#e0e7ff;
                 display:grid; place-items:center; font-weight:700; color:#3730a3; font-size:.85rem; flex:0 0 auto; }
  .who .nm { font-weight:600; font-size:.92rem; }
  .who .rf { font-size:.7rem; color:var(--muted); font-family:ui-monospace,Consolas,monospace; }

  .question { font-size:1.14rem; font-weight:700; line-height:1.35; margin-bottom:.2rem; }
  .prompt { font-size:.86rem; color:var(--muted); margin-bottom:.85rem; }

  textarea { width:100%; padding:.75rem .85rem; border:1.5px solid var(--line);
             border-radius:11px; font:inherit; min-height:110px; resize:vertical; color:var(--ink); }
  textarea:focus { outline:none; border-color:var(--accent); }
  .count { text-align:right; font-size:.72rem; color:var(--muted); margin-top:.25rem; }
  .count.over { color:#dc2626; font-weight:600; }

  .privacy { display:flex; gap:.5rem; align-items:flex-start; background:var(--warn-bg);
             border:1px solid #fcd34d; color:#78350f; border-radius:9px;
             padding:.55rem .7rem; font-size:.76rem; margin:.7rem 0 1rem; }

  /* ── Option picker ─────────────────────────────────────────────────────── */
  .options { display:flex; flex-direction:column; gap:.5rem; margin-bottom:.9rem; }
  .opt { display:flex; align-items:center; gap:.7rem; width:100%; text-align:left;
         background:#fff; border:1.5px solid var(--line); border-radius:12px;
         padding:.7rem .85rem; font:inherit; color:var(--ink); cursor:pointer;
         transition:border-color .12s, background .12s, box-shadow .12s; }
  .opt:hover { border-color:#c7d2fe; }
  .opt.sel { border-color:var(--accent); background:#eff6ff;
             box-shadow:0 0 0 2px rgba(37,99,235,.14); }
  .opt .n { width:26px; height:26px; flex:0 0 auto; border-radius:50%;
            display:grid; place-items:center; font-size:.82rem; font-weight:700;
            background:#eef2ff; color:#3730a3; }
  .opt.sel .n { background:var(--accent); color:#fff; }
  .opt .txt { font-size:.9rem; line-height:1.35; }
  .opt.own { border-style:dashed; }
  .opt.own .txt { color:var(--muted); font-weight:600; }
  .opt.own.sel .txt { color:var(--ink); }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:.45rem;
         background:var(--accent); color:#fff; border:none; border-radius:11px;
         padding:.75rem 1.3rem; font:inherit; font-weight:600; cursor:pointer; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .actions { display:flex; gap:.6rem; }
  .actions .btn:first-child { flex:1; }

  /* ── Thanks card ───────────────────────────────────────────────────────── */
  .thanks { text-align:center; padding:.5rem 0 .25rem; }
  .thanks .tick { width:54px; height:54px; margin:0 auto .7rem; }
  .thanks h3 { font-size:1.2rem; margin-bottom:.3rem; }
  .thanks p { color:var(--muted); font-size:.88rem; margin-bottom:1.1rem; }
  .hidden { display:none !important; }
  .err { color:#dc2626; font-size:.82rem; margin-top:.5rem; }
</style>
</head>
<body>
<div class="widget" id="widget">

  <!-- ── Counter ─────────────────────────────────────────────────────────── -->
  <div class="counter">
    <div class="counter-head">
      <div>
        <div class="counter-label">Pledges this session</div>
        <div class="counter-n" id="count">0</div>
        <div class="counter-sub" id="count-sub">No pledges yet</div>
      </div>
      <div class="session-chip" id="session-chip">Session —</div>
    </div>
    <div class="pitch" id="pitch">
      <!-- Rugby goal posts (H): two tall uprights + a crossbar. A kicked ball
           sails up and over the crossbar between them — a conversion. -->
      <svg class="posts" id="posts" viewBox="0 0 96 104" fill="none"
           stroke="currentColor" stroke-width="5" stroke-linecap="round" aria-hidden="true">
        <line x1="26" y1="104" x2="26" y2="6"/>
        <line x1="70" y1="104" x2="70" y2="6"/>
        <line x1="22" y1="60" x2="74" y2="60"/>
      </svg>
      <div class="ground"></div>
    </div>
  </div>

  <!-- ── Capture form ────────────────────────────────────────────────────── -->
  <div class="body">
    <div id="form-view">
      <div class="who" id="who">
        <div class="avatar" id="who-initial">?</div>
        <div>
          <div class="nm" id="who-name">No student selected</div>
          <div class="rf" id="who-ref">—</div>
        </div>
      </div>

      <div class="question" id="question">Loading session…</div>
      <div class="prompt" id="prompt"></div>

      <!-- Five predefined options + a sixth "own idea" that reveals the text box. -->
      <div class="options" id="options" role="radiogroup" aria-label="Pledge options"></div>

      <!-- Only shown when the sixth option is chosen. -->
      <div id="own-wrap" class="hidden">
        <textarea id="pledge" maxlength="1000"
                  placeholder="Write your own pledge — start with “I will…”" aria-label="Your own pledge"></textarea>
        <div class="count" id="char-count">0 / 1000</div>
        <div class="privacy">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" style="flex:0 0 auto;margin-top:1px">
            <path d="M12 3l7 4v5c0 4.4-3 8.4-7 9.5C8 20.4 5 16.4 5 12V7z"/>
          </svg>
          <span>Don’t include real names — not yours, not anyone else’s. Only the pledge text is stored.</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="submit" disabled>Submit pledge</button>
        <button class="btn secondary" id="skip">Skip</button>
      </div>
      <div class="err hidden" id="err"></div>
    </div>

    <!-- ── Thanks ────────────────────────────────────────────────────────── -->
    <div id="thanks-view" class="thanks hidden">
      <svg class="tick" viewBox="0 0 52 52" fill="none">
        <circle cx="26" cy="26" r="24" stroke="#059669" stroke-width="3" opacity=".25"/>
        <path d="M15 27l8 8 15-16" stroke="#059669" stroke-width="4"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h3>Pledge recorded</h3>
      <p id="thanks-sub">Pass the device to the next student.</p>
      <button class="btn wide" id="next" style="width:100%">Next student</button>
    </div>
  </div>
</div>

<!-- ── The single placeholder token ───────────────────────────────────────
     One token design, as agreed. Swap this symbol for real artwork later;
     everything references it via <use href="#tft-token">. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="tft-token" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="18" fill="#38bdf8"/>
    <circle cx="20" cy="20" r="18" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <path d="M13 20.5l4.5 4.5L27 15.5" stroke="#fff" stroke-width="3.2"
          fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<script type="module" src="./pledge-widget-app.js"></script>
</body>
</html>
